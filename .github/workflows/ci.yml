name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMS_TEST_DATABASE_URL: postgres://forms:forms-test-only@127.0.0.1:5432/forms_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: forms_test
          POSTGRES_USER: forms
          POSTGRES_PASSWORD: forms-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forms -d forms_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/admin
        run: npm ci
      - name: Check and test frontend
        working-directory: web/admin
        run: |
          npm run check
          npm run test
          npm run build
          npm audit --audit-level=high
      - name: Enforce admin bundle budget
        run: |
          ./scripts/check-bundle.sh
          ./scripts/check-public-budget.sh
      - name: Check and test backend
        run: |
          test -z "$(gofmt -l $(find cmd internal migrations -name '*.go' -type f))"
          go vet ./...
          go test -count=1 ./...
          go test -race -run TestLoginLimiterConcurrent ./internal/web
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build the single production binary
        run: >-
          CGO_ENABLED=0 go build -mod=readonly -trimpath -buildvcs=false
          -ldflags "-s -w -buildid= -X forms/internal/version.Version=ci
          -X forms/internal/version.Commit=${GITHUB_SHA}
          -X forms/internal/version.BuildDate=1970-01-01T00:00:00Z"
          -o bin/forms ./cmd/forms
