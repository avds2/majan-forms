name: forms-development

services:
  postgres:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: forms
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: forms-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forms-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms -d forms"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  forms-postgres:
